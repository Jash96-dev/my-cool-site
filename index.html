<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to My Website</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: Arial, sans-serif;
      color: #ffffff;
      text-align: center;
    }
    .box {
      background: #1e293b;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h1 { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Welcome to My Website!</h1>
    <p>This site is live on the internet.</p>
  </div>
</body>
</html>
